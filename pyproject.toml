[project]
name = "nledp"
version = "0.1.0"
description = "National Law Enforcement Data & Intelligence Platform — data foundation"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1", "polars>=1.0", "httpx>=0.27", "pyyaml>=6.0",
  "pydantic>=2.7", "typer>=0.12", "rich>=13.0", "openpyxl>=3.1",
  "rapidfuzz>=3.9", "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
nledp = "nledp.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
